name: 下書きの検証

on:
  pull_request:
    paths:
      - "posts/queue/**"
      - "scripts/**"
      - "config/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下書きを検証
        run: node scripts/validate.mjs
